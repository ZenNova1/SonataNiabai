# SonataNiabai is a plain static site (HTML/CSS/JS + media files) with no
# framework, package manager, or build step. The repository root is published as-is.
[build]
  publish = "."
  command = ""

# The entry page is SonataNiabai.html (there is no index.html), so serve it at "/".
[[redirects]]
  from = "/"
  to = "/SonataNiabai.html"
  status = 200
